name: CI

# The only automated gate for Kanzen (there was none before). Runs the same
# checks as `make check` — but against PostgreSQL + Redis so that SQLite-only
# no-ops (KB full-text search, SELECT ... FOR UPDATE) are actually exercised.
# Lint is currently non-blocking while the pre-existing ruff debt is cleared
# (see docs/qa-audit-2026-06-14/06-REMEDIATION-PLAN.md, Sprint 3); flip it to
# blocking once `ruff check .` is clean.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kanzen
          POSTGRES_PASSWORD: kanzen
          POSTGRES_DB: kanzen
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: main.settings
      # Tests run under dev settings (as they do locally). This also exercises
      # the corrected DJANGO_DEBUG default: leaving this unset would now load
      # prod.py (fail-safe), which is asserted by the settings tests.
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-insecure-key-not-for-production
      JWT_SECRET_KEY: ci-insecure-jwt-key
      DATABASE_URL: postgres://kanzen:kanzen@localhost:5432/kanzen
      REDIS_URL: redis://localhost:6379
      BASE_DOMAIN: localhost
      BASE_SCHEME: http

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Lint (ruff) — non-blocking until lint debt is cleared
        continue-on-error: true
        run: ruff check .

      - name: Migration check
        run: python manage.py makemigrations --check --dry-run

      - name: Theme check
        run: python scripts/check_theme.py

      - name: Tests (pytest on PostgreSQL)
        run: pytest -q
