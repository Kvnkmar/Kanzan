{% extends "base.html" %}
{% block title %}Contact Detail - Kanzen Suite{% endblock %}

{% block content %}
<!-- Breadcrumb Header -->
<div class="contact-page-header">
  <div class="contact-breadcrumb">
    <a href="{% url 'frontend:contact-list' %}" class="breadcrumb-link">Contacts</a>
    <i class="ti ti-chevron-right breadcrumb-sep"></i>
    <span class="breadcrumb-current" id="contactNameBreadcrumb">Loading...</span>
  </div>
  <div class="contact-header-actions">
    <a href="{% url 'frontend:contact-list' %}" class="btn btn-outline-secondary btn-sm">
      <i class="ti ti-arrow-left"></i> Back
    </a>
    <button type="button" id="saveContactBtn" class="btn btn-primary btn-sm">
      <span id="saveText"><i class="ti ti-check"></i> Save</span>
      <span id="saveSpinner" class="d-none">
        <span class="spinner-border spinner-border-sm me-1" role="status"></span>Saving...
      </span>
    </button>
    <div class="dropdown">
      <button class="btn btn-outline-secondary btn-sm dropdown-toggle no-caret" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="More actions">
        <i class="ti ti-dots" aria-hidden="true"></i>
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item" href="{% url 'frontend:contact-create' %}"><i class="ti ti-plus"></i> Create New</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item text-danger" href="#" id="deleteContactBtn"><i class="ti ti-trash"></i> Delete</a></li>
      </ul>
    </div>
  </div>
</div>

<!-- Alert -->
<div id="formAlert" class="alert d-none mb-3" role="alert"></div>

<!-- Loading State -->
<div id="loadingState" class="text-center py-5">
  <div class="spinner-border spinner-border-sm text-primary" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
  <span class="loading-text ms-2">Loading contact...</span>
</div>

<!-- Two-column layout -->
<div class="contact-form-layout d-none" id="contactDetailLayout">
  <form id="contactForm" novalidate>
    <div class="contact-form-grid">
      <!-- LEFT COLUMN (Main) -->
      <div class="contact-form-main">
        <div class="contact-form-card">
          <div class="contact-section-header">
            <h6 class="contact-section-title">
              <i class="ti ti-grid-dots"></i> Overview
            </h6>
          </div>

          <!-- Salutation + First Name + Last Name -->
          <div class="contact-field-row">
            <label class="contact-field-label">Name <span class="text-danger">*</span></label>
            <div class="contact-field-value">
              <div class="name-fields-group">
                <select id="contactSalutation" name="salutation" class="form-select contact-salutation-select">
                  <option value="">--</option>
                  <option value="Mr.">Mr.</option>
                  <option value="Mrs.">Mrs.</option>
                  <option value="Ms.">Ms.</option>
                  <option value="Dr.">Dr.</option>
                  <option value="Prof.">Prof.</option>
                </select>
                <input type="text" id="contactFirstName" name="first_name" class="form-control" placeholder="First Name" required maxlength="150">
                <input type="text" id="contactLastName" name="last_name" class="form-control" placeholder="Last Name" required maxlength="150">
              </div>
              <div class="invalid-feedback" id="first_nameError"></div>
              <div class="invalid-feedback" id="last_nameError"></div>
            </div>
          </div>

          <!-- Company -->
          <div class="contact-field-row">
            <label class="contact-field-label">Company</label>
            <div class="contact-field-value">
              <div class="d-flex gap-2 align-items-center">
                <select id="contactCompany" name="company" class="form-select flex-grow-1">
                  <option value="">Select company...</option>
                </select>
                <button type="button" id="newCompanyBtn" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#newCompanyModal">
                  <i class="ti ti-plus"></i> New
                </button>
              </div>
            </div>
          </div>

          <!-- Email -->
          <div class="contact-field-row">
            <label class="contact-field-label">Email <span class="text-danger">*</span></label>
            <div class="contact-field-value">
              <div class="contact-multi-field" id="emailFieldsContainer">
                <div class="contact-input-with-actions">
                  <input type="email" id="contactEmail" name="email" class="form-control" placeholder="email@example.com" required>
                  <div class="contact-field-icons">
                    <button type="button" class="contact-icon-btn" title="Opt-out" aria-label="Opt-out"><i class="ti ti-mail-off" aria-hidden="true"></i></button>
                    <button type="button" class="contact-icon-btn" title="Block" aria-label="Block"><i class="ti ti-shield-x" aria-hidden="true"></i></button>
                  </div>
                </div>
              </div>
              <button type="button" class="contact-add-field-btn" id="addEmailBtn">
                <i class="ti ti-circle-plus"></i> Add Email
              </button>
              <div class="invalid-feedback" id="emailError"></div>
            </div>
          </div>

          <!-- Phone -->
          <div class="contact-field-row">
            <label class="contact-field-label">Phone</label>
            <div class="contact-field-value">
              <div class="contact-multi-field" id="phoneFieldsContainer">
                <div class="contact-input-with-actions">
                  <select class="form-select contact-phone-type">
                    <option value="Mobile">Mobile</option>
                    <option value="Office">Office</option>
                    <option value="Home">Home</option>
                    <option value="Fax">Fax</option>
                    <option value="Other">Other</option>
                  </select>
                  <select class="form-select contact-phone-country"></select>
                  <input type="tel" id="contactPhone" name="phone" class="form-control" placeholder="12345678" maxlength="30">
                  <div class="contact-field-icons">
                    <button type="button" class="contact-icon-btn" title="Opt-out" aria-label="Opt-out"><i class="ti ti-phone-off" aria-hidden="true"></i></button>
                    <button type="button" class="contact-icon-btn" title="Block" aria-label="Block"><i class="ti ti-shield-x" aria-hidden="true"></i></button>
                  </div>
                </div>
              </div>
              <button type="button" class="contact-add-field-btn" id="addPhoneBtn">
                <i class="ti ti-circle-plus"></i> Add Phone
              </button>
            </div>
          </div>

          <!-- Job Title -->
          <div class="contact-field-row">
            <label class="contact-field-label">Job Title</label>
            <div class="contact-field-value">
              <input type="text" id="contactJobTitle" name="job_title" class="form-control" placeholder="e.g. Marketing Manager" maxlength="100">
            </div>
          </div>

          <!-- Source -->
          <div class="contact-field-row">
            <label class="contact-field-label">Source</label>
            <div class="contact-field-value">
              <select id="contactSource" name="source" class="form-select">
                <option value="">Select source...</option>
                <option value="web">Web</option>
                <option value="email">Email</option>
                <option value="phone">Phone</option>
                <option value="referral">Referral</option>
                <option value="social">Social</option>
                <option value="other">Other</option>
              </select>
            </div>
          </div>

          <!-- Description -->
          <div class="contact-field-row">
            <label class="contact-field-label">Description</label>
            <div class="contact-field-value">
              <textarea id="contactDescription" name="notes" class="form-control" rows="4" placeholder="Add a description or notes about this contact..."></textarea>
            </div>
          </div>

          <!-- Address -->
          <div class="contact-section-header mt-4">
            <h6 class="contact-section-title">
              <i class="ti ti-map-pin"></i> Address
            </h6>
          </div>

          <div class="contact-field-row">
            <label class="contact-field-label">Street</label>
            <div class="contact-field-value">
              <input type="text" id="contactStreet" name="address_street" class="form-control" placeholder="Street address">
            </div>
          </div>

          <div class="contact-field-row">
            <label class="contact-field-label">City</label>
            <div class="contact-field-value">
              <input type="text" id="contactCity" name="address_city" class="form-control" placeholder="City">
            </div>
          </div>

          <div class="contact-field-row">
            <label class="contact-field-label">State / Province</label>
            <div class="contact-field-value">
              <input type="text" id="contactState" name="address_state" class="form-control" placeholder="State or Province">
            </div>
          </div>

          <div class="contact-field-row">
            <label class="contact-field-label">Postal Code</label>
            <div class="contact-field-value">
              <input type="text" id="contactPostalCode" name="address_postal" class="form-control" placeholder="ZIP / Postal Code">
            </div>
          </div>

          <div class="contact-field-row">
            <label class="contact-field-label">Country</label>
            <div class="contact-field-value">
              <input type="text" id="contactCountry" name="address_country" class="form-control" placeholder="Country">
            </div>
          </div>

          <!-- Personal -->
          <div class="contact-section-header mt-4">
            <h6 class="contact-section-title">
              <i class="ti ti-calendar-event"></i> Personal
            </h6>
          </div>

          <div class="contact-field-row">
            <label class="contact-field-label">Birthday</label>
            <div class="contact-field-value">
              <input type="date" id="contactBirthday" name="birthday" class="form-control">
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT COLUMN (Sidebar) -->
      <div class="contact-form-sidebar">
        <!-- Status -->
        <div class="contact-form-card">
          <div class="contact-sidebar-field">
            <label class="contact-sidebar-label">Status</label>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="contactActive" name="is_active" checked>
              <label class="form-check-label" for="contactActive">
                <span class="contact-status-label" id="contactStatusLabel">Active</span>
              </label>
            </div>
          </div>
        </div>

        <!-- Meta Info -->
        <div class="contact-form-card">
          <div class="contact-sidebar-field">
            <label class="contact-sidebar-label">Created</label>
            <span class="contact-meta-value" id="contactCreatedAt">--</span>
          </div>
          <div class="contact-sidebar-field mt-2">
            <label class="contact-sidebar-label">Updated</label>
            <span class="contact-meta-value" id="contactUpdatedAt">--</span>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>

<!-- New Company Modal -->
<div class="modal fade" id="newCompanyModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-semibold">New Company</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="newCompanyForm" novalidate>
        <div class="modal-body">
          <div id="newCompanyAlert" class="alert alert-danger d-none" role="alert"></div>
          <div class="mb-3">
            <label for="newCompanyName" class="form-label">Name <span class="text-danger">*</span></label>
            <input type="text" id="newCompanyName" class="form-control" required maxlength="200">
          </div>
          <div class="mb-3">
            <label for="newCompanyIndustry" class="form-label">Industry</label>
            <input type="text" id="newCompanyIndustry" class="form-control" maxlength="100">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" id="newCompanySubmit" class="btn btn-primary">
            <span id="newCompanyText"><i class="ti ti-check me-1"></i>Create</span>
            <span id="newCompanySpinner" class="d-none"><span class="spinner-border spinner-border-sm me-1" role="status"></span>Creating...</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
(function() {
  'use strict';

  var CONTACT_ID = '{{ contact_id }}';

  function formatDate(d) { return Kanzan.formatDateTime(d); }

  var COUNTRY_CODES = [
    { code: 'MY', dial: '+60', label: 'Malaysia' },
    { code: 'SG', dial: '+65', label: 'Singapore' },
    { code: 'ID', dial: '+62', label: 'Indonesia' },
    { code: 'TH', dial: '+66', label: 'Thailand' },
    { code: 'PH', dial: '+63', label: 'Philippines' },
    { code: 'VN', dial: '+84', label: 'Vietnam' },
    { code: 'IN', dial: '+91', label: 'India' },
    { code: 'CN', dial: '+86', label: 'China' },
    { code: 'JP', dial: '+81', label: 'Japan' },
    { code: 'KR', dial: '+82', label: 'South Korea' },
    { code: 'HK', dial: '+852', label: 'Hong Kong' },
    { code: 'TW', dial: '+886', label: 'Taiwan' },
    { code: 'AU', dial: '+61', label: 'Australia' },
    { code: 'NZ', dial: '+64', label: 'New Zealand' },
    { code: 'US', dial: '+1', label: 'United States' },
    { code: 'CA', dial: '+1', label: 'Canada' },
    { code: 'GB', dial: '+44', label: 'United Kingdom' },
    { code: 'IE', dial: '+353', label: 'Ireland' },
    { code: 'DE', dial: '+49', label: 'Germany' },
    { code: 'FR', dial: '+33', label: 'France' },
    { code: 'NL', dial: '+31', label: 'Netherlands' },
    { code: 'ES', dial: '+34', label: 'Spain' },
    { code: 'IT', dial: '+39', label: 'Italy' },
    { code: 'AE', dial: '+971', label: 'UAE' },
    { code: 'SA', dial: '+966', label: 'Saudi Arabia' },
    { code: 'ZA', dial: '+27', label: 'South Africa' },
    { code: 'BR', dial: '+55', label: 'Brazil' },
    { code: 'MX', dial: '+52', label: 'Mexico' }
  ];
  var DEFAULT_DIAL = '+60';

  function detectDial(phone) {
    if (!phone) return null;
    var trimmed = String(phone).trim();
    var dials = COUNTRY_CODES.map(function(c) { return c.dial; })
      .sort(function(a, b) { return b.length - a.length; });
    for (var i = 0; i < dials.length; i++) {
      if (trimmed.indexOf(dials[i]) === 0) return dials[i];
    }
    return null;
  }

  function populateCountrySelect(selectEl, currentDial) {
    while (selectEl.firstChild) selectEl.removeChild(selectEl.firstChild);
    COUNTRY_CODES.forEach(function(c) {
      var opt = document.createElement('option');
      opt.value = c.dial;
      opt.dataset.country = c.code;
      opt.textContent = c.dial + ' ' + c.code;
      selectEl.appendChild(opt);
    });
    selectEl.value = currentDial || DEFAULT_DIAL;
  }

  function wirePhoneRow(row, initialDial) {
    var country = row.querySelector('.contact-phone-country');
    var input = row.querySelector('input[type="tel"]');
    if (!country || !input) return;
    if (!country.options.length) populateCountrySelect(country, initialDial || DEFAULT_DIAL);
    country.addEventListener('change', function() {
      var newDial = country.value;
      var raw = input.value.trim();
      var stripped = raw.replace(/^\+\d{1,4}\s*/, '');
      input.value = (newDial + ' ' + stripped).trim();
      input.focus();
    });
  }

  document.querySelectorAll('#phoneFieldsContainer .contact-input-with-actions').forEach(function(row) {
    wirePhoneRow(row, DEFAULT_DIAL);
  });

  // --- Load companies ---
  Api.get('/api/v1/contacts/companies/').then(function(data) {
    var select = document.getElementById('contactCompany');
    (data.results || data).forEach(function(c) {
      var opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = c.name;
      select.appendChild(opt);
    });
  }).catch(function() {});

  // --- New Company modal ---
  document.getElementById('newCompanyForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var nameEl = document.getElementById('newCompanyName');
    var industryEl = document.getElementById('newCompanyIndustry');
    var alertEl = document.getElementById('newCompanyAlert');
    var btn = document.getElementById('newCompanySubmit');
    alertEl.classList.add('d-none');
    var name = nameEl.value.trim();
    if (!name) {
      alertEl.textContent = 'Company name is required.';
      alertEl.classList.remove('d-none');
      return;
    }
    var payload = { name: name };
    var industry = industryEl.value.trim();
    if (industry) payload.industry = industry;
    btn.disabled = true;
    document.getElementById('newCompanyText').classList.add('d-none');
    document.getElementById('newCompanySpinner').classList.remove('d-none');
    Api.post('/api/v1/contacts/companies/', payload).then(function(c) {
      var select = document.getElementById('contactCompany');
      var opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = c.name;
      select.appendChild(opt);
      select.value = c.id;
      bootstrap.Modal.getInstance(document.getElementById('newCompanyModal')).hide();
      document.getElementById('newCompanyForm').reset();
      Toast.success('Company created');
    }).catch(function(err) {
      var msg = 'Failed to create company';
      if (err && typeof err === 'object') {
        var parts = [];
        Object.keys(err).forEach(function(k) {
          var v = err[k];
          if (Array.isArray(v)) parts.push(k + ': ' + v.join(' '));
          else if (typeof v === 'string') parts.push(k + ': ' + v);
        });
        if (parts.length) msg = parts.join(' | ');
      }
      alertEl.textContent = msg;
      alertEl.classList.remove('d-none');
    }).finally(function() {
      btn.disabled = false;
      document.getElementById('newCompanyText').classList.remove('d-none');
      document.getElementById('newCompanySpinner').classList.add('d-none');
    });
  });

  // --- Load contact ---
  Api.get('/api/v1/contacts/contacts/' + CONTACT_ID + '/').then(function(contact) {
    document.getElementById('loadingState').classList.add('d-none');
    document.getElementById('contactDetailLayout').classList.remove('d-none');

    var fullName = ((contact.first_name || '') + ' ' + (contact.last_name || '')).trim();
    document.getElementById('contactNameBreadcrumb').textContent = fullName || 'Unnamed';

    document.getElementById('contactFirstName').value = contact.first_name || '';
    document.getElementById('contactLastName').value = contact.last_name || '';
    document.getElementById('contactEmail').value = contact.email || '';
    document.getElementById('contactPhone').value = contact.phone || '';
    var detectedDial = detectDial(contact.phone);
    var primaryCountry = document.querySelector('#phoneFieldsContainer .contact-phone-country');
    if (primaryCountry) primaryCountry.value = detectedDial || DEFAULT_DIAL;
    document.getElementById('contactJobTitle').value = contact.job_title || '';
    document.getElementById('contactSource').value = contact.source || '';
    document.getElementById('contactDescription').value = contact.notes || '';
    document.getElementById('contactActive').checked = contact.is_active !== false;
    document.getElementById('contactStatusLabel').textContent = contact.is_active !== false ? 'Active' : 'Inactive';

    if (contact.company && typeof contact.company === 'object') {
      document.getElementById('contactCompany').value = contact.company.id;
    } else if (contact.company) {
      document.getElementById('contactCompany').value = contact.company;
    }

    // Populate custom_data fields
    var cd = contact.custom_data || {};
    if (cd.salutation) document.getElementById('contactSalutation').value = cd.salutation;
    if (cd.phone_type) {
      var pt = document.querySelector('.contact-phone-type');
      if (pt) pt.value = cd.phone_type;
    }
    document.getElementById('contactStreet').value = cd.address_street || '';
    document.getElementById('contactCity').value = cd.address_city || '';
    document.getElementById('contactState').value = cd.address_state || '';
    document.getElementById('contactPostalCode').value = cd.address_postal || '';
    document.getElementById('contactCountry').value = cd.address_country || '';
    document.getElementById('contactBirthday').value = cd.birthday || '';

    document.getElementById('contactCreatedAt').textContent = formatDate(contact.created_at);
    document.getElementById('contactUpdatedAt').textContent = formatDate(contact.updated_at);
  }).catch(function(err) {
    document.getElementById('loadingState').innerHTML = '<div class="text-danger"><i class="ti ti-alert-triangle me-2"></i>Failed to load contact.</div>';
  });

  // --- Status toggle ---
  document.getElementById('contactActive').addEventListener('change', function() {
    document.getElementById('contactStatusLabel').textContent = this.checked ? 'Active' : 'Inactive';
  });

  // --- Add Email ---
  document.getElementById('addEmailBtn').addEventListener('click', function() {
    var container = document.getElementById('emailFieldsContainer');
    var div = document.createElement('div');
    div.className = 'contact-input-with-actions mt-2';
    div.innerHTML = '<input type="email" class="form-control extra-email" placeholder="email@example.com">' +
      '<div class="contact-field-icons">' +
        '<button type="button" class="contact-icon-btn" title="Opt-out" data-action="optout-email"><i class="ti ti-mail-off"></i></button>' +
        '<button type="button" class="contact-icon-btn" title="Block" data-action="block-email"><i class="ti ti-shield-x"></i></button>' +
        '<button type="button" class="contact-icon-btn text-danger" title="Remove" onclick="this.closest(\'.contact-input-with-actions\').remove()"><i class="ti ti-trash"></i></button>' +
      '</div>';
    container.appendChild(div);
  });

  // --- Add Phone ---
  document.getElementById('addPhoneBtn').addEventListener('click', function() {
    var container = document.getElementById('phoneFieldsContainer');
    var div = document.createElement('div');
    div.className = 'contact-input-with-actions mt-2';
    div.innerHTML = '<select class="form-select contact-phone-type"><option value="Mobile">Mobile</option><option value="Office">Office</option><option value="Home">Home</option><option value="Fax">Fax</option><option value="Other">Other</option></select>' +
      '<select class="form-select contact-phone-country"></select>' +
      '<input type="tel" class="form-control extra-phone" placeholder="12345678" maxlength="30">' +
      '<div class="contact-field-icons"><button type="button" class="contact-icon-btn text-danger" title="Remove" onclick="this.closest(\'.contact-input-with-actions\').remove()"><i class="ti ti-trash"></i></button></div>';
    container.appendChild(div);
    wirePhoneRow(div, DEFAULT_DIAL);
    if (window.KanzenSelect) {
      div.querySelectorAll('select.form-select').forEach(function(s) { KanzenSelect.upgrade(s); });
    }
  });

  // --- Save ---
  document.getElementById('saveContactBtn').addEventListener('click', function() {
    document.querySelectorAll('#contactForm .is-invalid').forEach(function(f) { f.classList.remove('is-invalid'); });

    var firstName = document.getElementById('contactFirstName').value.trim();
    var lastName = document.getElementById('contactLastName').value.trim();
    var email = document.getElementById('contactEmail').value.trim();
    var valid = true;

    if (!firstName) { document.getElementById('contactFirstName').classList.add('is-invalid'); valid = false; }
    if (!lastName) { document.getElementById('contactLastName').classList.add('is-invalid'); valid = false; }
    if (!email) { document.getElementById('contactEmail').classList.add('is-invalid'); valid = false; }
    if (!valid) return;

    var primaryCountrySel = document.querySelector('#phoneFieldsContainer .contact-phone-country');
    var primaryDial = primaryCountrySel ? primaryCountrySel.value : DEFAULT_DIAL;
    var rawPhone = document.getElementById('contactPhone').value.trim();
    var combinedPhone = '';
    if (rawPhone) combinedPhone = rawPhone.charAt(0) === '+' ? rawPhone : (primaryDial + ' ' + rawPhone).trim();

    var payload = {
      first_name: firstName,
      last_name: lastName,
      email: email,
      phone: combinedPhone || null,
      company: document.getElementById('contactCompany').value || null,
      job_title: document.getElementById('contactJobTitle').value.trim() || null,
      source: document.getElementById('contactSource').value || null,
      notes: document.getElementById('contactDescription').value.trim(),
      is_active: document.getElementById('contactActive').checked,
    };

    var customData = {};
    var salutation = document.getElementById('contactSalutation').value;
    if (salutation) customData.salutation = salutation;
    var phoneType = document.querySelector('.contact-phone-type');
    if (phoneType) customData.phone_type = phoneType.value;

    var addrStreet = document.getElementById('contactStreet').value.trim();
    var addrCity = document.getElementById('contactCity').value.trim();
    var addrState = document.getElementById('contactState').value.trim();
    var addrPostal = document.getElementById('contactPostalCode').value.trim();
    var addrCountry = document.getElementById('contactCountry').value.trim();
    var birthday = document.getElementById('contactBirthday').value;
    if (addrStreet) customData.address_street = addrStreet;
    if (addrCity) customData.address_city = addrCity;
    if (addrState) customData.address_state = addrState;
    if (addrPostal) customData.address_postal = addrPostal;
    if (addrCountry) customData.address_country = addrCountry;
    if (birthday) customData.birthday = birthday;

    var extraEmails = [];
    document.querySelectorAll('#emailFieldsContainer .extra-email').forEach(function(el) {
      if (el.value.trim()) extraEmails.push(el.value.trim());
    });
    if (extraEmails.length > 0) customData.additional_emails = extraEmails;

    var extraPhones = [];
    document.querySelectorAll('#phoneFieldsContainer .mt-2').forEach(function(row) {
      var t = row.querySelector('.contact-phone-type');
      var ctry = row.querySelector('.contact-phone-country');
      var ph = row.querySelector('.extra-phone');
      if (ph && ph.value.trim()) {
        var raw = ph.value.trim();
        var dial = ctry ? ctry.value : DEFAULT_DIAL;
        extraPhones.push({
          type: t ? t.value : 'Other',
          country: dial,
          number: raw.charAt(0) === '+' ? raw : (dial + ' ' + raw).trim()
        });
      }
    });
    if (extraPhones.length > 0) customData.additional_phones = extraPhones;

    if (Object.keys(customData).length > 0) payload.custom_data = customData;

    var btn = document.getElementById('saveContactBtn');
    btn.disabled = true;
    document.getElementById('saveText').classList.add('d-none');
    document.getElementById('saveSpinner').classList.remove('d-none');

    Api.patch('/api/v1/contacts/contacts/' + CONTACT_ID + '/', payload).then(function() {
      sessionStorage.setItem('toast', 'Contact updated successfully');
      window.location.href = '/contacts/';
    }).catch(function(err) {
      btn.disabled = false;
      document.getElementById('saveText').classList.remove('d-none');
      document.getElementById('saveSpinner').classList.add('d-none');
      var msg = 'Failed to update contact';
      if (err && typeof err === 'object') {
        var parts = [];
        Object.keys(err).forEach(function(k) {
          var v = err[k];
          if (Array.isArray(v)) parts.push(k + ': ' + v.join(' '));
          else if (typeof v === 'string') parts.push(k + ': ' + v);
        });
        if (parts.length) msg = parts.join(' | ');
      }
      Toast.error(msg);
    });
  });

  // --- Delete ---
  document.getElementById('deleteContactBtn').addEventListener('click', function(e) {
    e.preventDefault();
    if (!confirm('Are you sure you want to delete this contact? This action cannot be undone.')) return;
    Api.delete('/api/v1/contacts/contacts/' + CONTACT_ID + '/').then(function() {
      sessionStorage.setItem('toast', 'Contact deleted');
      window.location.href = '/contacts/';
    }).catch(function() {
      Toast.error('Failed to delete contact');
    });
  });

})();
</script>
{% endblock %}
